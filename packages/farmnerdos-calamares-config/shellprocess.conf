# Target-chroot cleanup + kernel restore. Runs BEFORE the bootloader module.
#
# Two jobs:
#  1. strip live-session artifacts (passwordless-sudo farmer user, autologin,
#     archiso mkinitcpio config, the installer itself)
#  2. restore the kernel: mkarchiso strips /boot from the squashfs, so we
#     reinstall linux-cachyos + microcode from packages stashed in the ISO.
#     mkarchiso ALSO strips /etc/pacman.d/gnupg, so the keyring must be
#     initialized first — the installed system needs it for updates anyway.
#     pacman's hooks then generate a default preset and build the initramfs —
#     which is why settings.conf has no initcpiocfg/initcpio modules.
#
# Ordering matters: archiso conf/preset and mkinitcpio-archiso must be gone
# BEFORE the kernel reinstall triggers mkinitcpio.
# pacman removals are one-per-line and '-'-tolerant: a single -Rns with any
# missing target aborts, and the calamares provider name varies.
---
dontChroot: false
timeout: 900
script:
  - "rm -f /etc/sysusers.d/farmnerdos-live.conf"
  - "rm -f /etc/tmpfiles.d/farmnerdos-live.conf"
  - "rm -f /etc/sudoers.d/00-farmnerdos-live"
  - "rm -f /etc/sddm.conf.d/20-farmnerdos-live-autologin.conf"
  - "rm -f /etc/motd"
  - "rm -f /usr/local/bin/farmnerdos-install"
  - "rm -f /etc/skel/Desktop/install-farmnerdos.desktop"
  - "rm -f /home/*/Desktop/install-farmnerdos.desktop"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "rm -f /etc/mkinitcpio.d/linux-cachyos.preset"
  - "-pacman -Rns --noconfirm mkinitcpio-archiso"
  - "pacman-key --init"
  - "pacman-key --populate"
  - "pacman -U --noconfirm /usr/share/farmnerdos/pkgs/*.pkg.tar.zst"
  - "rm -rf /usr/share/farmnerdos/pkgs"
  - "-pacman -Rns --noconfirm farmnerdos-calamares-config"
  - "-pacman -Rns --noconfirm cachyos-calamares"
  - "-pacman -Rns --noconfirm calamares"
