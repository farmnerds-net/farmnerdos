# pacman.conf used by mkarchiso AT BUILD TIME.
# @FARMNERDOS_REPO@ is replaced with an absolute file:// path by scripts/build-iso.sh.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Our own packages. Unsigned during alpha — signing lands in v0.2.
[farmnerdos]
SigLevel = Optional TrustAll
Server = @FARMNERDOS_REPO@

# CachyOS — kernel + calamares. Build host must trust key F3B607488DB35A47
# (scripts/build-iso.sh takes care of it).
[cachyos]
Server = https://mirror.cachyos.org/repo/x86_64/cachyos

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
