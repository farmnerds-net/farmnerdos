# FarmNerdOS runtime pacman.conf (installed system + live environment)

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
Color
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# FarmNerdOS packages — DISABLED until the hosted repo exists. A dead URL here
# would make every 'pacman -Syu' fail for users. Uncomment once GitHub Pages
# is live, and drop TrustAll when repo signing lands (v0.2).
#[farmnerdos]
#SigLevel = Optional TrustAll
#Server = https://<org>.github.io/<repo>/$arch

# CachyOS — kernel updates come from here.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
