name: Build ISO release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default; publishing (Pages push / release
# upload) needs explicit write access
permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    env:
      # secrets aren't allowed in step-level `if`; route through job env
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: auto
    container:
      image: archlinux:base-devel
      # mkarchiso needs loop devices + privileged mounts
      options: --privileged --user root
    steps:
      - name: Install build deps
        run: pacman -Syu --noconfirm git archiso

      - uses: actions/checkout@v4

      - name: Build local package repo
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c ./scripts/build-packages.sh

      - name: Build ISO
        run: ./scripts/build-iso.sh

      # GitHub release assets cap at 2GiB; the ISO (~3GB) ships via R2 instead.
      - name: Upload ISO to Cloudflare R2
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          pacman -S --noconfirm aws-cli || pacman -S --noconfirm aws-cli-v2
          cd out
          sha256sum *.iso > "$(ls *.iso).sha256"
          aws s3 cp . "s3://farmnerdos-releases/" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Create release (checksum + download pointer)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.sha256
          body: |
            FarmNerdOS Seedling — alpha. Dark mode, green thumb, CachyOS kernel.

            The ISO exceeds GitHub's 2GiB asset limit and is hosted on
            Cloudflare R2 — see the README for the current download link.
            Verify with the attached .sha256.

      - name: Upload ISO artifact (manual runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: farmnerdos-iso
          path: out/*.iso
